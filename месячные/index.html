<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f2">
  <meta name="description" content="Маленький мир для Лиэль: музыка, воспоминания, письма и купоны заботы.">
  <title>Маленький мир для Лиэль ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="#home" data-route="home" aria-label="На главную">
      <span class="brand-icon" aria-hidden="true">🎀</span>
      <span>для Лиэль <span class="brand-heart">♥</span></span>
    </a>
    <nav class="navigation" aria-label="Навигация">
      <button class="nav-button is-active" type="button" data-route="home">Главная</button>
      <button class="nav-button" type="button" data-route="memories">Воспоминания</button>
      <button class="nav-button" type="button" data-route="codes">Сюрпризы и видео</button>
      <button class="nav-button" type="button" data-route="heart">Для нас</button>
      <button class="nav-button" type="button" data-route="coupons">Купоны</button>
      <button class="nav-button" type="button" data-route="favorites">Избранное <span class="favorite-count" data-favorite-count>0</span></button>
    </nav>
  </header>
  <main id="app" class="app" tabindex="-1"></main>
  <footer class="site-footer">
    <span>Собрано для тебя — с музыкой и теплом</span>
    <span class="footer-heart" aria-hidden="true">♥</span>
  </footer>
  <dialog class="photo-dialog" id="photo-dialog" aria-label="Просмотр фотографии">
    <button class="photo-dialog-close" type="button" data-action="close-photo" aria-label="Закрыть фотографию">×</button>
    <button class="photo-dialog-nav photo-dialog-prev" type="button" data-action="photo-prev" aria-label="Предыдущая фотография">‹</button>
    <img class="photo-dialog-image" id="photo-dialog-image" alt="Фотография из альбома">
    <button class="photo-dialog-nav photo-dialog-next" type="button" data-action="photo-next" aria-label="Следующая фотография">›</button>
    <p class="photo-dialog-caption" id="photo-dialog-caption"></p>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
